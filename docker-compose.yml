services:
  padellen-monitor:
    image: ghcr.io/ykpdang/padellen-signup:latest
    container_name: padellen-monitor
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      # Single mounted folder holds config.json and the persisted state file.
      - ./config:/app/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
